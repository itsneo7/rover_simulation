# ARES-1 robot_description metadata
# Actual dimensions live in urdf/ares1_properties.xacro (single source of truth).
# This file only records which entry-point xacro to load and top-level frame names,
# so launch files do not hardcode paths in multiple places.

robot_description:
  xacro_package: "ares1_description"
  xacro_relative_path: "urdf/ares1.urdf.xacro"

frames:
  map_frame: "map"
  odom_frame: "odom"
  base_frame: "base_link"
  base_footprint_frame: "base_footprint"

wheel_joints:
  - front_left_wheel_joint
  - front_right_wheel_joint
  - rear_left_wheel_joint
  - rear_right_wheel_joint

steering_joints:
  - front_left_steering_joint
  - front_right_steering_joint
  - rear_left_steering_joint
  - rear_right_steering_joint

suspension_joints:
  - front_left_suspension_joint
  - front_right_suspension_joint
  - rear_left_suspension_joint
  - rear_right_suspension_joint
