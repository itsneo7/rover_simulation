# ARES-1 GLOBAL COSTMAP — standalone reference file.
#
# IMPORTANT: Nav2's planner_server lifecycle node loads its costmap
# parameters from the SAME file passed to `--params-file` for the whole
# Nav2 stack (ares1_navigation/config/nav2_params.yaml), which already
# contains this exact `global_costmap:` block. This file is provided
# separately, as required, for quick reference/tuning without scrolling
# through the full nav2_params.yaml — if you change values here, copy the
# same values into nav2_params.yaml, or point planner_server's launch at
# this file directly instead (see ares1_navigation/launch/navigation.launch.py
# comments for how to do that).

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 2.0
      publish_frequency: 2.0
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.42, 0.30], [0.42, -0.30], [-0.42, -0.30], [-0.42, 0.30]]"
      footprint_padding: 0.03
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: "scan"
        scan:
          topic: /scan
          sensor_frame: lidar_link
          data_type: "LaserScan"
          clearing: true
          marking: true
          max_obstacle_height: 2.0
          obstacle_max_range: 15.0
          obstacle_min_range: 0.05
          raytrace_max_range: 16.0
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.6
      always_send_full_costmap: true
