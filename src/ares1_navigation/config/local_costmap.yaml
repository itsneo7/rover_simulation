# ARES-1 LOCAL COSTMAP — standalone reference file.
# See the note at the top of global_costmap.yaml: nav2_params.yaml is the
# file actually loaded by the running Nav2 stack; this mirrors that
# `local_costmap:` block for convenient standalone tuning/reference.

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      update_frequency: 10.0
      publish_frequency: 10.0
      footprint: "[[0.42, 0.30], [0.42, -0.30], [-0.42, -0.30], [-0.42, 0.30]]"
      footprint_padding: 0.03
      plugins: ["obstacle_layer", "pointcloud_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: "scan"
        scan:
          topic: /scan
          sensor_frame: lidar_link
          data_type: "LaserScan"
          clearing: true
          marking: true
          max_obstacle_height: 2.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.05
          raytrace_max_range: 8.5
          raytrace_min_range: 0.0
      pointcloud_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: "depth_points"
        depth_points:
          topic: /perception/obstacle_points
          sensor_frame: base_link
          data_type: "PointCloud2"
          clearing: true
          marking: true
          max_obstacle_height: 1.5
          min_obstacle_height: -0.4
          obstacle_max_range: 6.0
          obstacle_min_range: 0.1
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.5
      always_send_full_costmap: true
