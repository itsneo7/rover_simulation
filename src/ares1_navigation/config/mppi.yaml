# ARES-1 MPPI CONTROLLER — standalone reference file.
# Mirrors the `FollowPath:` block under controller_server in nav2_params.yaml.
# motion_model: "Omni" is what makes MPPI emit vx, vy AND wz — required for
# the 4WS4WD swivel-drive platform. Do not change this to "DiffDrive" or
# "Ackermann".

controller_server:
  ros__parameters:
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.4
      vx_max: 1.5
      vx_min: -0.75
      vy_max: 1.5
      wz_max: 1.5
      ax_max: 2.0
      ax_min: -2.0
      ay_max: 2.0
      az_max: 3.5
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.2
      temperature: 0.3
      gamma: 0.015
      motion_model: "Omni"
      visualize: true
      regenerate_noises: false
      critics:
        - "ConstraintCritic"
        - "CostCritic"
        - "GoalCritic"
        - "GoalAngleCritic"
        - "PathAlignCritic"
        - "PathFollowCritic"
        - "PathAngleCritic"
        - "PreferForwardCritic"
        - "ObstaclesCritic"
