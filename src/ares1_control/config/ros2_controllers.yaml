controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    steering_controller:
      type: forward_command_controller/ForwardCommandController

    wheel_velocity_controller:
      type: forward_command_controller/ForwardCommandController

# ----------------------------------------------------------------------
# Steering: 4 independent position-commanded revolute joints (swivel axes)
# ----------------------------------------------------------------------
steering_controller:
  ros__parameters:
    joints:
      - front_left_steering_joint
      - front_right_steering_joint
      - rear_left_steering_joint
      - rear_right_steering_joint
    interface_name: position

# ----------------------------------------------------------------------
# Wheels: 4 independent velocity-commanded continuous joints
# ----------------------------------------------------------------------
wheel_velocity_controller:
  ros__parameters:
    joints:
      - front_left_wheel_joint
      - front_right_wheel_joint
      - rear_left_wheel_joint
      - rear_right_wheel_joint
    interface_name: velocity

# ----------------------------------------------------------------------
# Joint state broadcaster: reports ALL joints (steering, wheel, and the
# passive suspension joints) on /joint_states.
# ----------------------------------------------------------------------
joint_state_broadcaster:
  ros__parameters:
    joints:
      - front_left_steering_joint
      - front_right_steering_joint
      - rear_left_steering_joint
      - rear_right_steering_joint
      - front_left_wheel_joint
      - front_right_wheel_joint
      - rear_left_wheel_joint
      - rear_right_wheel_joint
      - front_left_suspension_joint
      - front_right_suspension_joint
      - rear_left_suspension_joint
      - rear_right_suspension_joint
